[package]
name = "shepherd"
version = "1.3.6"
edition = "2024"
publish = false
description = "A native window for herdr: workspaces, tabs, panes and every coding agent at a glance"
license = "MIT"
repository = "https://github.com/freethinkel/shepherd"

# Its own workspace, like collie/desktop/app.
[workspace]

[dependencies]
ghostty-vt = { version = "=0.7.0", default-features = false }
anyhow = "1"
base64 = "0.22"
futures = "0.3"
gpui = { git = "https://github.com/zeronsh/zui", rev = "18a89af04cfe079d55275b111ac349d5640d9cda" }
gpui-base = { git = "https://github.com/zeronsh/gpui-component", rev = "103f13da91ff2c7c52941bdc2b1910f29716dc19" }
zeron-theme = { git = "https://github.com/zeronsh/comet", rev = "9e17e401710412adca91fe485886d65aa2d7e3eb" }
zeron-markdown = { git = "https://github.com/zeronsh/comet", rev = "9e17e401710412adca91fe485886d65aa2d7e3eb" }
zeron-syntax = { git = "https://github.com/zeronsh/comet", rev = "9e17e401710412adca91fe485886d65aa2d7e3eb" }
image = { version = "0.25", default-features = false, features = ["png"] }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "18a89af04cfe079d55275b111ac349d5640d9cda", features = ["font-kit", "runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
percent-encoding = "2"
serde_json = "1"
sha2 = "0.10"
bincode = { version = "2", features = ["serde"] }
tiny-skia = "0.11"
tokio = { version = "1", features = ["full"] }
ureq = "3.4.2"
# URLs of web integrations; the same crate ureq and wry use
http = "1"
# web integrations' pages, in the system web view
# `devtools`: Inspect Element in release builds too
wry = { version = "0.57", features = ["devtools"] }
toml_edit = "0.25"
emojis = "0.9.0"
unicode-width = "0.2"

# The Dock, notifications' authorization, Secure Keyboard Entry and the trackpad's haptics.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSDockTile", "NSEvent", "NSGraphics", "NSHapticFeedback", "NSImage", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSData", "NSGeometry", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter"] }
block2 = "0.6"

# herdr's named pipes.
[target.'cfg(windows)'.dependencies]
interprocess = { version = "2.4", features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dependencies]
# WebKitGTK's loop, pumped beside GPUI's while web pages live
gtk = "0.18"
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "18a89af04cfe079d55275b111ac349d5640d9cda", features = ["wayland", "x11"] }

[dev-dependencies]
gpui = { git = "https://github.com/zeronsh/zui", rev = "18a89af04cfe079d55275b111ac349d5640d9cda", features = ["test-support"] }
tempfile = "3"

# Linux packages, made by scripts/linux-dist.sh from the binary it builds. Vulkan is loaded at runtime, so the
# shared-library scan misses it.
[package.metadata.deb]
maintainer = "Egor Kolesnikov <freethinkel@gmail.com>"
section = "x11"
depends = "$auto, libvulkan1"
recommends = "mesa-vulkan-drivers"
assets = [
    ["target/release/shepherd", "usr/bin/", "755"],
    ["assets/linux/dev.freethinkel.shepherd.desktop", "usr/share/applications/", "644"],
    ["assets/linux/dev.freethinkel.shepherd.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/shepherd", dest = "/usr/bin/shepherd", mode = "755" },
    { source = "assets/linux/dev.freethinkel.shepherd.desktop", dest = "/usr/share/applications/dev.freethinkel.shepherd.desktop", mode = "644" },
    { source = "assets/linux/dev.freethinkel.shepherd.png", dest = "/usr/share/icons/hicolor/512x512/apps/dev.freethinkel.shepherd.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
vulkan-loader = "*"
"webkit2gtk4.1" = "*"

[package.metadata.generate-rpm.recommends]
mesa-vulkan-drivers = "*"

# gpui is slow unoptimized (Zeron and Collie do the same).
[profile.dev.package."*"]
opt-level = 2

# freethinkel/zui@notification-reply (on continuous-corners): three Metal drawables (with zui's two, a live window
# resize blocks in next_drawable and stutters as it starts), Apple's continuous corners, and notification actions that
# take text (Reply). Every zui crate is patched, so gpui-base and Shepherd share one gpui.
[patch."https://github.com/zeronsh/zui"]
collections = { git = "https://github.com/freethinkel/zui", rev = "c71f94761676d1a5bda55dd42c1dad7ea0c3441d" }
derive_refineable = { git = "https://github.com/freethinkel/zui", rev = "c71f94761676d1a5bda55dd42c1dad7ea0c3441d" }
gpui = { git = "https://github.com/freethinkel/zui", rev = "c71f94761676d1a5bda55dd42c1dad7ea0c3441d" }
gpui_linux = { git = "https://github.com/freethinkel/zui", rev = "c71f94761676d1a5bda55dd42c1dad7ea0c3441d" }
gpui_macos = { git = "https://github.com/freethinkel/zui", rev = "c71f94761676d1a5bda55dd42c1dad7ea0c3441d" }
gpui_macros = { git = "https://github.com/freethinkel/zui", rev = "c71f94761676d1a5bda55dd42c1dad7ea0c3441d" }
gpui_platform = { git = "https://github.com/freethinkel/zui", rev = "c71f94761676d1a5bda55dd42c1dad7ea0c3441d" }
gpui_shared_string = { git = "https://github.com/freethinkel/zui", rev = "c71f94761676d1a5bda55dd42c1dad7ea0c3441d" }
gpui_util = { git = "https://github.com/freethinkel/zui", rev = "c71f94761676d1a5bda55dd42c1dad7ea0c3441d" }
gpui_web = { git = "https://github.com/freethinkel/zui", rev = "c71f94761676d1a5bda55dd42c1dad7ea0c3441d" }
gpui_wgpu = { git = "https://github.com/freethinkel/zui", rev = "c71f94761676d1a5bda55dd42c1dad7ea0c3441d" }
gpui_windows = { git = "https://github.com/freethinkel/zui", rev = "c71f94761676d1a5bda55dd42c1dad7ea0c3441d" }
http_client = { git = "https://github.com/freethinkel/zui", rev = "c71f94761676d1a5bda55dd42c1dad7ea0c3441d" }
media = { git = "https://github.com/freethinkel/zui", rev = "c71f94761676d1a5bda55dd42c1dad7ea0c3441d" }
perf = { git = "https://github.com/freethinkel/zui", rev = "c71f94761676d1a5bda55dd42c1dad7ea0c3441d" }
refineable = { git = "https://github.com/freethinkel/zui", rev = "c71f94761676d1a5bda55dd42c1dad7ea0c3441d" }
scheduler = { git = "https://github.com/freethinkel/zui", rev = "c71f94761676d1a5bda55dd42c1dad7ea0c3441d" }
sum_tree = { git = "https://github.com/freethinkel/zui", rev = "c71f94761676d1a5bda55dd42c1dad7ea0c3441d" }
util_macros = { git = "https://github.com/freethinkel/zui", rev = "c71f94761676d1a5bda55dd42c1dad7ea0c3441d" }
