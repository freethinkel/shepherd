# Every push to main builds and tests Shepherd.app. When Cargo.toml's version has no release yet, the run tags
# v<version> and publishes Shepherd-<version>-arm64.zip: bump the version to release.
# ponytail: ad-hoc signed, not notarized; Gatekeeper wants `xattr -dr com.apple.quarantine Shepherd.app` until a
# Developer ID cert and notarytool are wired in.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: make test
      - run: make zip

      - name: Release a new version
        run: |
          tag="v$(make -s version)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
          else
            gh release create "$tag" target/release/Shepherd-*.zip --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Shepherd
          path: target/release/Shepherd-*.zip
