# Push a tag v<Cargo.toml version> → a GitHub release with Shepherd-<version>-arm64.zip.
# ponytail: ad-hoc signed, not notarized; Gatekeeper wants `xattr -dr com.apple.quarantine Shepherd.app` until a
# Developer ID cert and notarytool are wired in.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(make -s version)"

      - run: make test
      - run: make zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/release/Shepherd-*.zip --generate-notes

      - name: Artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Shepherd
          path: target/release/Shepherd-*.zip
