# Every push to main builds and tests Shepherd.app. When Cargo.toml's version has no release yet, the run tags
# v<version> and publishes a universal (arm64 + x86_64) Shepherd as a zip and a dmg: bump the version to release.
# With the signing secrets set the app is signed with the Developer ID and notarized; without them, ad hoc.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, for the release notes
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Signing keychain
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials shepherd-notary --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id Z7PK4B5KU2 --keychain "$kc"
          echo "NOTARY_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - run: make test
      - name: Build, sign, notarize
        run: make ${{ env.MACOS_CERT_P12 != '' && 'notarize' || 'dist' }}

      - name: Release a new version
        run: |
          tag="v$(make -s version)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
          else
            # The notes are the commits since the last release, docs and the version bump left out.
            prev="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            {
              git log --no-merges --format='- %s' ${prev:+"$prev"..}HEAD | grep -vE '^- (docs|release):' || true
              [ -n "$prev" ] && printf '\n**Full Changelog**: %s/compare/%s...%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$prev" "$tag"
            } > "$RUNNER_TEMP/notes.md"
            gh release create "$tag" target/universal/Shepherd-*.zip target/universal/Shepherd-*.dmg --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Shepherd
          path: |
            target/universal/Shepherd-*.zip
            target/universal/Shepherd-*.dmg
