# Every push to main builds and tests Shepherd.app and builds Shepherd for Linux (x86_64 and aarch64). When
# Cargo.toml's version has no release yet, the run tags v<version> and publishes a universal (arm64 + x86_64)
# Shepherd as a zip and a dmg, and each Linux architecture as a tar.gz, a .deb and an .rpm: bump the version to
# release. With the signing secrets set the app is signed with the Developer ID and notarized; without them, ad hoc.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    # the SDK it links against picks the window chrome: built with an SDK before 26, the app keeps the old traffic lights
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, for the release notes
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # libghostty-vt (ghostty-vt-sys) builds with Zig 0.16; ZIG=zig wins over .cargo/config.toml's local path.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: echo "ZIG=zig" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2

      - name: Signing keychain
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials shepherd-notary --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id Z7PK4B5KU2 --keychain "$kc"
          echo "NOTARY_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - run: make lint
      - run: make test
      - name: Build, sign, notarize
        run: make ${{ env.MACOS_CERT_P12 != '' && 'notarize' || 'dist' }}

      - uses: actions/upload-artifact@v4
        with:
          name: Shepherd-macos
          path: |
            target/universal/Shepherd-*.zip
            target/universal/Shepherd-*.dmg

  linux:
    strategy:
      matrix:
        # the oldest supported Ubuntu: its glibc is the oldest the packages run on
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: echo "ZIG=zig" >> "$GITHUB_ENV"
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - uses: Swatinem/rust-cache@v2
      # the Linux side of cfg'd code: its own key defaults, notifications, paths
      - run: make lint
      - run: make test
      # one build, packed as a tar.gz, a .deb and an .rpm
      - run: scripts/linux-dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Shepherd-linux-${{ runner.arch }}
          path: target/linux-dist/*

  release:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, for the release notes
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release a new version
        run: |
          tag="v$(make -s version)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
          else
            # The notes are the commits since the last release, docs and the version bump left out.
            prev="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            {
              git log --no-merges --format='- %s' ${prev:+"$prev"..}HEAD | grep -vE '^- (docs|release):' || true
              [ -n "$prev" ] && printf '\n**Full Changelog**: %s/compare/%s...%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$prev" "$tag"
            } > "$RUNNER_TEMP/notes.md"
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          fi
